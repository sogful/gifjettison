name: release userscript

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: check manifest version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath "manifest.json" -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          $previousversion = $null
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.event.before }}" -notmatch "^0+$") {
            $previousmanifest = git show ("${{ github.event.before }}" + ":manifest.json") 2>$null
            if ($LASTEXITCODE -eq 0) {
              $previousversion = [string](($previousmanifest -join "`n" | ConvertFrom-Json).version)
            }
          }
          $changed = "true"
          if ($previousversion -eq $version) { $changed = "false" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "changed=$changed" >> $env:GITHUB_OUTPUT

      - name: build userscript
        if: steps.version.outputs.changed == 'true'
        run: node .github/builduserscript.js

      - name: write release notes
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        run: |
          @"
          install with [tampermonkey](https://chromewebstore.google.com/detail/tampermonkey/dhdgffkkebhmkfjojejmpbldmpobfkfo) or [violentmonkey](https://chromewebstore.google.com/detail/violentmonkey/jinjaccalgkegednnccohejagnlnfdagl).<br>
          [*what is a userscript?*](https://en.wikipedia.org/wiki/Userscript)
          "@ | Set-Content -LiteralPath "notes.md" -Encoding utf8

      - name: create or update the release
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $title = "userscript (v$env:RELEASE_VERSION)"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title --notes-file "notes.md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag ".github/gifjettison.user.js" --clobber
          } else {
            gh release create $tag ".github/gifjettison.user.js" --title $title --notes-file "notes.md"
          }
